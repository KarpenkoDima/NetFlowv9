apiVersion: 1
datasources:
  - name: ClickHouse-NetFlow
    uid: clickhouse-netflow
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      defaultDatabase: netflow
      timezone: UTC
    secureJsonData:
      username: default
      password: ""
